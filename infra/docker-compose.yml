services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coagent
      POSTGRES_USER: coagent
      POSTGRES_PASSWORD: coagent
    ports:
      - "5432:5432"
    volumes:
      - coagent-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  coagent-postgres:
